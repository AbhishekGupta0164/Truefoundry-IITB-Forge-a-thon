name: CI

on:
  push:
    branches: [ main, "feat/*" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Truefoundry-IITB-Forge-a-thon/package-lock.json
      - name: Install dependencies
        working-directory: ./
        run: npm ci || npm install
      - name: Run Typecheck
        run: npm run typecheck
      - name: Run Linter
        run: npm run lint
      - name: Run Unit Tests
        run: npm run test:unit
